services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: hotel-cancel-guard-api
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: hotel-cancel-guard-ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
